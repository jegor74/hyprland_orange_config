#: FONTS
font_family JetBrains Mono Nerd Font
font_size 14.0

#: CURSOR CUSTOMIZATION
cursor_shape underline

#: SCROLLBACK (NONE)
#: MOUSE (NONE)
#: MOUSE ACTIONS (NONE)
#: PERFORMANCE TUNING (NONE)
#: TERMINAL BELL (NONE)

#: WINDOW LAYOUT
window_padding_width 10
remember_window_size no

#: TAB BAR (NONE)

#: COLOR SCHEME
foreground #ffddbb
background #0f0f0f 
background_opacity 0.65
background_blur 1
selection_foreground #1e1e1e
selection_background #f58456

# NORMAL COLORS

# Black
color0 #0b0c15
# Red
color1 #d2556c
# Green
color2 #ff8700
# Yellow
color3 #efb184
# Blue
color4 #6ca1f3
# Magenta
color5 #b78df0
# Cyan
color6 #69bcf4
# White
color7 #c0caf5


# BRIGHT COLORS

# Bright Black
color8  #39404a
# Bright Red
color9  #f7768e
# Bright Green
color10 #85e89d
# Bright Yellow
color11 #f4cf8d
# Bright Blue
color12 #8fb9ff
# Bright Magenta
color13 #d9a3ff
# Bright Cyan
color14 #8fd3ff
# Bright White
color15 #ffddbb

#: THE COLOR TABLE (NONE)
#: ADVANCED (NONE)
#: OS SPECIFIC TWEAKS (NONE)

#: KEYBOARD SHORTCUTS
kitty_mod ctrl+shift

#: CLIPBOARD
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

#: SCROLLING (NONE)
#: WINDOW MANAGEMENT (NONE)
#: LAYOUT MANAGEMENT (NONE)
#: FONT SIZES (NONE)
#: SELECT AND ACT ON VISIBLE TEXT (NONE)
#: MISCELLANEOUS (NONE)
